name: Tests

# Unit and UI tests on an iOS simulator. The repo is public, so GitHub's macOS runners are free.
# Real-device and field checks still run on the Mac (Tess).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Unit and UI tests (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Pick and boot a simulator
        id: sim
        run: scripts/boot-simulator.sh
      # SCREENSHOT_DIR makes the UI tests write their review shots (App Store, accessibility, previews).
      - name: Unit and UI tests
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/shots
        run: |
          mkdir -p shots
          set -o pipefail
          xcodebuild test \
            -project MapRouletteChoice.xcodeproj \
            -scheme MapRouletteChoice \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "^(Test Suite|Test [Cc]ase .*(passed|failed|skipped)|\*\* TEST|.*error:)" || true
          # A UI test that can't find its screen prints the accessibility tree between these markers.
          sed -n '/AXDUMP-BEGIN/,/AXDUMP-END/p' xcodebuild.log | head -300
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
            shots
          if-no-files-found: warn
          retention-days: 14

  # How long a 5,200-place campaign takes to open (L1-CLUSTER's yardstick): first places, full
  # tally, pin redraws, peak memory. Report only; it doesn't fail on slow numbers, only when the
  # tally never shows. The table is on the run's summary page.
  open-time:
    name: Open time (5,200 places)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pick and boot a simulator
        id: sim
        run: scripts/boot-simulator.sh
      # Debug, because the -demoLoad campaign is debug-only; Tess's AB13b numbers are Debug too.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MapRouletteChoice.xcodeproj \
            -scheme MapRouletteChoice \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "(error:|\*\* BUILD)" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          app=$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" ! -name "*Tests*" | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"
      - name: Open a 5,200-place campaign
        run: scripts/open-time.py "${{ steps.sim.outputs.udid }}" 5200
      - name: Upload timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: open-time
          path: |
            open-time.json
            open-time.log
            build.log
          if-no-files-found: warn
          retention-days: 14
